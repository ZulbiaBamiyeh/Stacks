<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stackbrawl Unit Battle</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .proto-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
      .proto-top > * { pointer-events: auto; }
      .castle { flex: 1; min-width: 0; background: var(--tile); color: #fff; border-radius: 14px; padding: 8px 12px 10px; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
      .castle .row { display: flex; justify-content: space-between; font-weight: 900; font-size: 15px; gap: 8px; }
      .castle .sub { font-size: 12.5px; opacity: .7; font-weight: 800; }
      .castle.right { text-align: right; }
      .castle.right .bar .fill { left: auto; right: 0; }
      .castle.right .bar .lag { left: auto; right: 0; }
      .mid-chip { flex: 0 0 auto; align-self: center; }
      .editor { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; pointer-events: none; }
      .editor > * { pointer-events: auto; }
      .wall-ed { background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 8px 10px; box-shadow: 4px 5px 0 rgba(42,36,28,.25); }
      .wall-ed h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin-bottom: 6px; }
      .slots { display: flex; gap: 5px; }
      .slot-btn { width: 74px; padding: 6px 4px; border-radius: 10px; background: #fff; border: 2px solid var(--ink); font-weight: 900; font-size: 13px; line-height: 1.1; }
      .slot-btn.villager { background: #efe6cc; }
      .slot-btn.warrior { background: #e8b9a8; }
      .slot-btn.archer { background: #c9dcb5; }
      .slot-btn small { display: block; font-size: 10.5px; opacity: .65; font-weight: 800; }
      .controls { display: flex; flex-direction: column; gap: 6px; margin-left: auto; align-items: flex-end; }
      .controls .rowc { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .presets { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
      .presets button { font-size: 12px; padding: 4px 8px; border-radius: 8px; background: var(--tile); color: #fff; font-weight: 900; }
      .legend { font-size: 12.5px; font-weight: 800; color: var(--ink-soft); max-width: 300px; margin-top: 4px; }
      @media (max-width: 900px) { .slot-btn { width: 52px; font-size: 11px; } .castle .sub { display: none; } }
    </style>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div class="proto-top">
        <div class="castle" id="castle-0"></div>
        <div class="chip mid-chip" id="clock">Set up both walls</div>
        <div class="castle right" id="castle-1"></div>
      </div>
      <div class="editor">
        <div class="wall-ed"><h4>Your wall (click to cycle)</h4><div class="slots" id="slots-0"></div>
          <div class="presets" id="presets-0"></div></div>
        <div class="wall-ed"><h4>Enemy wall · warriors beat villagers, arrows ignore armour, villagers overrun archers</h4><div class="slots" id="slots-1"></div>
          <div class="presets" id="presets-1"></div></div>
        <div class="controls">
          <div class="rowc">
            <button class="chip btn speed" data-speed="1" type="button">1×</button>
            <button class="chip btn speed" data-speed="2" type="button">2×</button>
            <button class="chip btn speed" data-speed="4" type="button">4×</button>
            <button class="chip btn" id="btn-reset" type="button">Reset</button>
          </div>
          <button id="btn-fight" type="button">Fight!</button>
        </div>
      </div>
      <div id="banner" hidden></div>
      <div id="loading">Raising armies…</div>
    </div>
    <script type="module" src="src/proto/main.js"></script>
  </body>
</html>
